<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link  rel="stylesheet" type="text/css" href="./assets/style.css">
    <title>JS Calculator</title>
</head>
<body>
    <div class="container">
        <div class="display fl-c">
            <p id="curr-ops">0</p>
            <p id="res"></p>
        </div>
        <div class="all-buttons fl-c">
            <div class="row fl-r" id="first-row">
                <div class="number fl-r">AC</div>
                <div class="number fl-r">C</div>
                <div class="number fl-r">DEL</div>
                <div class="op  fl-r">-</div>
            </div>
            <div class="row fl-r">
                <div class="number fl-r">7</div>
                <div class="number fl-r">8</div>
                <div class="number fl-r">9</div>
                <div class="op fl-r">÷</div>
            </div>
            <div class="row fl-r">
                <div class="number fl-r">4</div>
                <div class="number fl-r">5</div>
                <div class="number fl-r">6</div>
                <div class="op fl-r">-</div>
            </div>
            <div class="row fl-r">
                <div class="number fl-r">1</div>
                <div class="number fl-r">2</div>
                <div class="number fl-r">3</div>
                <div class="op fl-r">+</div>
            </div>
            <div class="row fl-r">
                <div class="op sign">+/-</div>
                <div class="number fl-r">0</div>
                <div class="op" id="dot">.</div>
                <div class="op equal fl-r">=</div>
            </div>
        </div>
    </div>
    <script src="./calculator.js"></script>
</body>
</html>
